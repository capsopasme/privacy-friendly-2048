name: Release APK

# Builds the APK and attaches it to a GitHub release.
# - runs automatically when a release is published
# - can be started by hand (Actions → Release APK → Run workflow) for an existing tag,
#   e.g. to add the APK to a release that was published before this workflow existed
#
# Signing: if the repository secrets SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD,
# SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD are set, a signed release build is made, so every
# future release can be installed over the previous one. Without them a debug build is attached.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the APK to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets set, building a debug APK."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.signing.outputs.variant }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Collect APK
        run: |
          apk=$(ls app/build/outputs/apk/${{ steps.signing.outputs.variant }}/*.apk | head -n 1)
          out="privacy-friendly-2048-forest-${TAG}.apk"
          cp "$apk" "$out"
          echo "APK_FILE=$out" >> "$GITHUB_ENV"

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$APK_FILE" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}
